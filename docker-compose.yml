services:
  # ─── Infrastructure ─────────────────────────────────
  postgresql:
    image: postgres:17-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-hss}-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    networks:
      - backend
    healthcheck:
      interval: 5s
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-hss}-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD:-}"
      --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Development Tools (for development purpose) ─────
  adminer:
    image: adminer:latest
    container_name: ${COMPOSE_PROJECT_NAME:-hss}-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - backend

  smtp4dev:
    image: rnwood/smtp4dev
    container_name: ${COMPOSE_PROJECT_NAME:-hss}-smtp4dev
    restart: unless-stopped
    ports:
      - "5000:80"
      - "2525:25"
    networks:
      - backend

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: ${COMPOSE_PROJECT_NAME:-hss}-redis-commander
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    networks:
      - backend

  # ─── Microservices ───────────────────────────────────
  auth-service:
    build:
      context: ./auth-service
    container_name: ${COMPOSE_PROJECT_NAME:-hss}-auth-service
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      PORT: 3000
      SERVICE_NAME: auth-service
      NODE_ENV: development
      DB_HOST: postgresql
      DB_PORT: 5432
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: auth_service
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgresql:5432/auth_service
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-different-secret}
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET:-change-this-to-a-random-secret}
    networks:
      - backend
    depends_on:
      postgresql:
        condition: service_healthy

  schedule-service:
    build:
      context: ./schedule-service
    container_name: ${COMPOSE_PROJECT_NAME:-hss}-schedule-service
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      PORT: 3000
      SERVICE_NAME: schedule-service
      NODE_ENV: development
      DB_HOST: postgresql
      DB_PORT: 5432
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: schedule_service
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgresql:5432/schedule_service
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-different-secret}
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET:-change-this-to-a-random-secret}
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-2525}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@example.com}
      AUTH_SERVICE_URL: http://auth-service:3000
    networks:
      - backend
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── Migrations (one-off) ────────────────────────────
  # Run with: docker compose run --rm migrate-<service>

  migrate-auth-service:
    build:
      context: ./auth-service
    container_name: ${COMPOSE_PROJECT_NAME:-hss}-migrate-auth
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgresql:5432/auth_service
    networks:
      - backend
    depends_on:
      postgresql:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy && npx prisma generate"

  migrate-schedule-service:
    build:
      context: ./schedule-service
    container_name: ${COMPOSE_PROJECT_NAME:-hss}-migrate-schedule
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgresql:5432/schedule_service
    networks:
      - backend
    depends_on:
      postgresql:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy && npx prisma generate"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  backend:
    driver: bridge
