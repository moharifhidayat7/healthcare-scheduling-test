services:
  postgresql:
    image: postgres:17-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-hss}-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-nest_ms}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    networks:
      - backend
    healthcheck:
      interval: 5s
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-hss}-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD:-}"
      --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./auth-service
    container_name: ${COMPOSE_PROJECT_NAME:-hss}-auth-service
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      PORT: 3000
      SERVICE_NAME: auth-service
      NODE_ENV: development
      DB_HOST: postgresql
      DB_PORT: 5432
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: auth_service
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgresql:5432/auth_service
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-different-secret}
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET:-change-this-to-a-random-secret}
    networks:
      - backend
    depends_on:
      postgresql:
        condition: service_healthy

  # ─── Migrations (one-off) ────────────────────────────
  # Run with: docker compose run --rm migrate-<service>
  # Add a new entry for each service that owns a database.

  migrate-auth-service:
    build:
      context: ./auth-service
    container_name: ${COMPOSE_PROJECT_NAME:-hss}-migrate-auth
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgresql:5432/auth_service
    networks:
      - backend
    depends_on:
      postgresql:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy && npx prisma generate"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  backend:
    driver: bridge
